name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KI_VERSION: v0.6.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: sudo apt-get update && sudo apt-get install --yes mandoc
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd tooling/boundaries
      - name: Install released KI
        env:
          KI_CLI_INSTALL_DIR: ${{ runner.temp }}/ki/bin
          KI_MAN_INSTALL_DIR: ${{ runner.temp }}/ki/man/man1
          KI_DATA_HOME: ${{ runner.temp }}/ki/data
          KI_CONFIG_HOME: ${{ runner.temp }}/ki/config
          KI_MCP_SOURCE: ${{ runner.temp }}/ki/config/mcp-servers.yaml
          KI_CACHE_HOME: ${{ runner.temp }}/ki/cache
          XDG_STATE_HOME: ${{ runner.temp }}/ki/state
          KI_STATE_HOME: ${{ runner.temp }}/ki/state/ki
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude"
          printf '{}\n' > "$HOME/.claude/settings.json"
          mkdir -p "$(dirname "$KI_MCP_SOURCE")"
          printf 'mcpServers: []\n' > "$KI_MCP_SOURCE"
          curl --fail -sSL --proto '=https' -o "$RUNNER_TEMP/install.sh" \
            "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "v$(ki --version)" = "$KI_VERSION"
          ki bootstrap
          ki registry add --repo .
          ki repo repair --repo .
          diag=$(ki diag)
          grep -F 'Configuration: valid' <<<"$diag"
          grep -F 'Registry: valid' <<<"$diag"
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
          {
            printf 'KI_CLI_INSTALL_DIR=%s\n' "$KI_CLI_INSTALL_DIR"
            printf 'KI_MAN_INSTALL_DIR=%s\n' "$KI_MAN_INSTALL_DIR"
            printf 'KI_DATA_HOME=%s\n' "$KI_DATA_HOME"
            printf 'KI_CONFIG_HOME=%s\n' "$KI_CONFIG_HOME"
            printf 'KI_MCP_SOURCE=%s\n' "$KI_MCP_SOURCE"
            printf 'KI_CACHE_HOME=%s\n' "$KI_CACHE_HOME"
            printf 'XDG_STATE_HOME=%s\n' "$XDG_STATE_HOME"
            printf 'KI_STATE_HOME=%s\n' "$KI_STATE_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Audit
        run: ki repo audit --repo .
      - name: Test release package
        run: bun run self:release:test
      - name: Lint manual
        run: bun run ki:tools:lint-man
