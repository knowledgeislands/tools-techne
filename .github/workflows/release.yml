name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate requested release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag-commit: ${{ steps.release.outputs.tag-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd tooling/boundaries
      - run: bun run test
      - run: bun run test:coverage
      - id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin "refs/tags/$REQUESTED_VERSION:refs/tags/$REQUESTED_VERSION"
          tag_commit=$(git rev-parse --verify "$REQUESTED_VERSION^{commit}")
          package_version=$(git show "$tag_commit:package.json" | bun -e \
            'let source=""; for await (const chunk of Bun.stdin.stream()) source += new TextDecoder().decode(chunk); console.log(JSON.parse(source).version)')
          test "$REQUESTED_VERSION" = "v$package_version"
          version_source=$(git show "$tag_commit:src/version.ts")
          grep -Fxq "import packageMetadata from '../package.json' with { type: 'json' }" <<<"$version_source"
          grep -Fxq "export const TECHNE_VERSION = packageMetadata.version" <<<"$version_source"
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag-commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.asset-target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bun-target: bun-darwin-arm64
            asset-target: darwin-arm64
          - os: macos-latest
            bun-target: bun-darwin-x64
            asset-target: darwin-x64
          - os: ubuntu-latest
            bun-target: bun-linux-x64
            asset-target: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag-commit }}
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes mandoc
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd tooling/boundaries
      - run: bun run test
      - run: bash release/package.sh "${{ needs.validate.outputs.version }}" "${{ matrix.bun-target }}" "${{ matrix.asset-target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset-target }}
          path: dist/techne-${{ needs.validate.outputs.version }}-${{ matrix.asset-target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag-commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          release_dir=dist/release-assets
          test "$(find "$release_dir" -maxdepth 1 -type f -name 'techne-*.tar.gz' | wc -l | tr -d ' ')" = 3
          (
            cd "$release_dir"
            shasum -a 256 -- \
              techne-"$VERSION"-darwin-arm64.tar.gz \
              techne-"$VERSION"-darwin-x64.tar.gz \
              techne-"$VERSION"-linux-x64.tar.gz > techne-checksums.txt
            shasum -a 256 --check --strict techne-checksums.txt
          )
          remote_commit=$(git ls-remote origin "refs/tags/$VERSION^{}" | cut -f1)
          if [[ -z "$remote_commit" ]]; then
            remote_commit=$(git ls-remote origin "refs/tags/$VERSION" | cut -f1)
          fi
          test "$remote_commit" = "${{ needs.validate.outputs.tag-commit }}"
          gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --generate-notes \
            "$release_dir"/techne-"$VERSION"-darwin-arm64.tar.gz \
            "$release_dir"/techne-"$VERSION"-darwin-x64.tar.gz \
            "$release_dir"/techne-"$VERSION"-linux-x64.tar.gz \
            "$release_dir"/techne-checksums.txt
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$VERSION" --dir "$verify_dir"
          (cd "$verify_dir" && shasum -a 256 --check --strict techne-checksums.txt)
          TECHNE_INSTALL_TEST_MODE=1 TECHNE_INSTALL_TEST_ASSETS="$verify_dir" \
            TECHNE_INSTALL_DIR="$verify_dir/bin" TECHNE_MAN_INSTALL_DIR="$verify_dir/man/man1" \
            bash install.sh "$VERSION"
          test "$("$verify_dir/bin/techne" --version)" = "${VERSION#v}"
          "$verify_dir/bin/techne" --help > "$verify_dir/help.txt"
          grep -Fq 'techne completion <bash|zsh>' "$verify_dir/help.txt"
          "$verify_dir/bin/techne" completion bash > "$verify_dir/techne.bash"
          "$verify_dir/bin/techne" completion zsh > "$verify_dir/_techne"
          bash -n "$verify_dir/techne.bash"
          bash -c 'source "$1"; complete -p techne >/dev/null' _ "$verify_dir/techne.bash"
          grep -Fxq 'complete -F _techne techne' "$verify_dir/techne.bash"
          grep -Fxq '#compdef techne' "$verify_dir/_techne"
          grep -Fxq 'compdef _techne techne' "$verify_dir/_techne"
          test -f "$verify_dir/man/man1/techne.1"
          gh release edit "$VERSION" --draft=false --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq '.immutable')" = true

  notify-homebrew-tap:
    name: Notify Homebrew tap
    needs: [validate, publish]
    # Runs only once Kris has provisioned the shared release bot for this repository.
    if: vars.KI_TOOLS_RELEASE_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create tap-scoped release bot token
        id: release-bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.KI_TOOLS_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KI_TOOLS_RELEASE_BOT_PRIVATE_KEY }}
          owner: knowledgeislands
          repositories: homebrew-tap
      - name: Dispatch the published release to the tap
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg tag "$VERSION" \
            '{event_type: "tool-release-published", client_payload: {repository: $repository, tag: $tag}}' |
            gh api --method POST repos/knowledgeislands/homebrew-tap/dispatches --input -
          printf 'Dispatched %s %s to knowledgeislands/homebrew-tap\n' "$GITHUB_REPOSITORY" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
